# Omni-Notify example configuration.
#
# ${ENV} references are resolved from the process environment at load time, so
# secrets and tokens stay out of this file. Required env for this example:
#   OMNI_NOTIFY_API_TOKEN        bearer token clients must present
#   OMNI_NOTIFY_ENCRYPTION_KEY   base64 32-byte key (run: omni-notify genkey)
#   DISCORD_HOME_WEBHOOK         a Discord webhook URL
#   SMTP_PASSWORD                SMTP password for the email provider

server:
  addr: ":8080"
  max_body_bytes: 1048576       # 1 MiB
  read_timeout: 15s
  write_timeout: 15s

security:
  tokens:
    - "${OMNI_NOTIFY_API_TOKEN}"
  encryption_key: "${OMNI_NOTIFY_ENCRYPTION_KEY}"
  metrics_require_auth: false
  # When false (default, secure) provider URLs that resolve to private/loopback/
  # link-local/multicast addresses are rejected. Set true for homelab setups that
  # deliver to internal services.
  allow_private_webhook_targets: false

storage:
  path: "./omni-notify.db"

dedupe:
  default_window: 5m            # stateless dedup window when a route sets none
  default_repeat_interval: 0    # 0 = never re-notify an already-firing event

delivery:
  workers: 4
  queue_size: 256
  max_attempts: 5
  backoff_base: 2s
  backoff_factor: 2.0
  backoff_max: 5m
  send_timeout: 10s
  poll_interval: 1s

log:
  level: info                   # debug|info|warn|error
  format: text                  # text|json
  # Optionally tee logs to an omni-logging ingest endpoint (in addition to
  # stdout). Disabled by default. Forwarding is async and best-effort: if
  # omni-logging is slow or down, records are dropped rather than blocking the
  # service. omni-logging must be started with a matching ingest key
  # (OMNILOG_INGEST_KEYS / --ingest-key) equal to the api_key below.
  forward:
    enabled: false
    endpoint: "http://192.168.68.34:8080/api/v1/ingest"
    api_key: "${OMNI_LOGGING_API_KEY}"   # X-Api-Key sent to omni-logging
    service: "omni-notify"               # value of the "service" field
    batch_size: 100                      # records per POST
    buffer_size: 10000                   # max queued before dropping
    flush_interval: 2s                   # flush a partial batch after this long
    timeout: 5s                          # per-request HTTP timeout

# Providers seeded into SQLite on boot (managed_by=config). Edit/extend at runtime
# via POST /api/v1/providers (those are managed_by=api and never overwritten here).
providers:
  - name: discord-home
    kind: discord
    secret: "${DISCORD_HOME_WEBHOOK}"
    config:
      username: "Omni-Notify"

  - name: email-main
    kind: smtp
    secret: "${SMTP_PASSWORD}"
    config:
      host: "smtp.example.com"
      port: 587
      tls: starttls
      username: "alerts@example.com"
      from: "alerts@example.com"
      to:
        - "ops@example.com"

  # Telegram with photos and buttons (see README "Telegram photos and buttons").
  # Without image_hosts/callback_hosts it sends plain text, as before.
  # - name: telegram-home
  #   kind: telegram
  #   secret: "${TELEGRAM_BOT_TOKEN}"
  #   config:
  #     chat_id: "123456789"
  #     image_hosts: ["media.example.com"]     # image_url → a photo
  #     callback_hosts: ["media.example.com"]  # callbacks → buttons that POST
  #     callback_headers:
  #       X-Media-Request: "1"
  #     callback_user_ids: [123456789]         # who may press (default: the chat)

# Routes seeded into SQLite on boot. Match keys: type, source, severity, status,
# and dotted labels.<k> / annotations.<k>. All conditions must match (exact).
# Routes evaluate in priority order (higher first); ties broken by name. By
# default every matching route applies; stop_processing halts strictly
# lower-priority routes. A provider reached by several routes is delivered once.
routes:
  - name: critical-events
    priority: 100               # evaluated before lower-priority routes
    match:
      severity: critical
    providers:
      - discord-home
      - email-main
    repeat_interval: 1h         # re-notify if still firing after an hour

  - name: pihole
    priority: 50
    match:
      labels.service: pihole
    providers:
      - discord-home
    # stop_processing: true     # uncomment to skip strictly lower-priority routes

  - name: catch-all
    is_default: true            # only used when no other route matches
    providers:
      - discord-home

# VOICE_CALL channel: real incoming calls on the owner's iPhone (the Omni Notify
# app: PushKit + CallKit, with Gobbie's on-device Kokoro voice). Off unless
# enabled. Voice is a delivery channel, not a severity: any severity can ring,
# and an agent cannot raise its own rights by raising severity.
voice:
  enabled: false
  ring_timeout: 45s            # server marks a ringing call missed after this
  device_ring_timeout: 30s     # the phone stops ringing after this
  active_timeout: 5m           # an answered call with no device activity fails
  default_expiry: 2h           # how late a deferred/retried call may still ring
  # store_transcripts: false   # only the interpreted intent is stored by default

  # Token-based APNs (.p8 key from the Apple developer portal). Without key_id,
  # nothing is pushed and phones must poll while in the foreground (development).
  apns:
    key_id: "${APNS_KEY_ID}"
    team_id: "LVZHYJD66T"
    key_path: "/run/secrets/apns-voip.p8"
    topic: "dev.pod32g.OmniNotify"   # ".voip" is appended

  # Agents authenticate with an Omni-Identity client_credentials token (sub = aud
  # = the client id below), or, for local use, a static token given as its SHA-256.
  identity:
    issuer: "https://identity.omni.pod32g.dev"
    jwks_url: "https://identity.omni.pod32g.dev/jwks.json"

  agents:
    - id: claude
      display_name: Claude          # shown on the incoming-call screen
      identity_clients: [omni-notify-claude]
      # token_sha256: ["<sha256 of a static token>"]
      may_override_quiet_hours_for_user_reminders: true
      allow_test: true
      # actions: [acknowledge, dismiss, snooze, reschedule]   # the default
    - id: gpt
      display_name: GPT
      identity_clients: [omni-notify-gpt]
    - id: omni-oncall
      display_name: Omni Oncall
      identity_clients: [omni-oncall]
      may_override_quiet_hours_when_critical: true
      actions: [acknowledge]

  users:
    - id: pod32g
      aliases: [me]
      timezone: America/Mexico_City
      allowed_agents: [claude, gpt, omni-oncall]
      quiet_hours: {start: "23:00", end: "08:00"}
      exceptions:
        explicit_user_reminders: true   # for agents granted the override above
        critical_incidents: true        # likewise
      rate_limit: {max_calls_per_hour: 5, cooldown: 1m}
      retry: {max_attempts: 2, delay: 2m}   # a missed call is tried once more
      max_snooze: 12h
      # fallback_provider: discord-home     # gets the notification if the call goes unanswered

# To ring for routed events too, add a voice_call provider and name it in a route:
#   providers:
#     - name: call-me
#       kind: voice_call
#       config: {recipient: me, agent: omni-oncall}
# Optional plugins, off unless enabled. See docs/plugins/oncall.md.
# plugins:
#   oncall:
#     enabled: true
#     storage: {path: "./oncall.db"}
#     push: {provider: oncall-push}  # page registered phones through this apns provider (optional)
#     identity:                     # sign-in with Omni Identity (optional)
