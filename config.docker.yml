# Container configuration mounted into the image at /etc/omni-notify/config.yml.
# ${ENV} values are resolved at load time from the container environment (set via
# docker-compose's environment block / CI secrets), so no secrets live in git.
#
# Providers and routes are managed at runtime through the REST API; none are
# seeded here.

server:
  addr: ":8080"
  max_body_bytes: 1048576

security:
  tokens:
    - "${OMNI_NOTIFY_API_TOKEN}"
  encryption_key: "${OMNI_NOTIFY_ENCRYPTION_KEY}"
  metrics_require_auth: false
  # true: allow delivery to private/LAN targets (homelab services on this subnet).
  allow_private_webhook_targets: true

storage:
  path: "/data/omni-notify.db"

dedupe:
  default_window: 5m
  default_repeat_interval: 0

delivery:
  workers: 4
  max_attempts: 5
  backoff_base: 2s
  backoff_factor: 2.0
  backoff_max: 5m
  send_timeout: 10s

log:
  level: info
  format: json
  # Tee logs to omni-logging (running on this box). Requires omni-logging to be
  # started with a matching ingest key (OMNILOG_INGEST_KEYS) and the same value
  # provided here as OMNI_LOGGING_API_KEY in the container environment.
  forward:
    enabled: true
    endpoint: "http://192.168.68.34:8080/api/v1/ingest"
    api_key: "${OMNI_LOGGING_API_KEY}"
    service: "omni-notify"

# Voice calls: Gobbie rings the owner's iPhone (the Omni On-Call app) through
# CallKit, from a VoIP push. The push uses the on-call app's APNs key: the
# oncall-push provider (made with the admin API), so the .p8 exists once.
# Phones reach the device API through Omni Access (notify.omni.pod32g.dev).
# Transcripts are kept so the app's call history can show what was said.
voice:
  enabled: true
  store_transcripts: true
  # The phone door: a call in progress (load it, report its state, take turns)
  # on its own port, device credentials only. Omni Access publishes it as a
  # public name, because a locked phone can't sign in to Omni Access. All the
  # rest of Notify stays behind the gateway's sign-in.
  phone_addr: ":8082"
  phone_url: "https://calls.omni.pod32g.dev"
  apns:
    provider: oncall-push
  agents:
    # Claude (Claude Code, `omni-notify call` / MCP): a static token whose
    # SHA-256 is below; the token is on the owner's Mac.
    - id: claude
      display_name: Claude
      token_sha256: ["e441f10a4b037528e27840653fc663c4996701edfe9304c70119ff9991bf73c8"]
      allow_test: true
      may_override_quiet_hours_for_user_reminders: true
    # On-call pages, once a voice_call provider is in someone's contacts.
    - id: omni-oncall
      display_name: Omni On-Call
      may_override_quiet_hours_when_critical: true
      actions: [acknowledge]
  users:
    - id: pod32g
      aliases: [me]
      timezone: America/Mexico_City
      allowed_agents: [claude, omni-oncall]
      rate_limit: {max_calls_per_hour: 6, cooldown: 1m}
      retry: {max_attempts: 2, delay: 2m}
      max_snooze: 12h

# The on-call plugin (docs/plugins/oncall.md): incidents, schedules and
# escalation for the Omni On-Call app, served at /oncall/api/v1. The phone
# reaches it through Omni Access (notify.omni.pod32g.dev, an enrolled device's
# token in Proxy-Authorization) with its own token in Authorization.
#
# A starter directory: only the owner so far. Add people (token_sha256 is the
# SHA-256 of their token, never the token), their contacts (Notify provider
# names a page goes through), schedules and policies here; routes to providers
# of kind oncall turn alerts into incidents.
plugins:
  oncall:
    enabled: true
    storage:
      path: "/data/oncall.db"
    # Pages also go to the phones people registered in the Omni On-Call app,
    # through this Notify provider (kind apns, created with the API: it holds
    # the .p8). Until it exists, a push page says "Not sent" in the timeline.
    push:
      provider: oncall-push
    # Sign-in with Omni Identity. The Omni On-Call app reuses the phone's Omni
    # Access sign-in, whose tokens are for the Access gateway (its client id).
    identity:
      issuer: "https://identity.omni.pod32g.dev"
      audiences: [omni_vy47oxmf]
    users:
      - id: u_pod32g
        name: pod32g
        identity: pod32g
        timezone: America/Mexico_City
        # A personal token for scripts (curl over SSH); the app signs in with Omni.
        token_sha256: "88d701883e6da8a8dde9e6e576bda7eeafc124b549d7cfe3c710a3b6b50229b0"
        # No contacts: the owner is paged only by push to the On-Call app (the
        # phones registered there, through oncall-push), not on Telegram.
        contacts: []
    teams:
      - {id: t_omni, name: Omni, members: [u_pod32g]}
    schedules:
      - id: sch_primary
        name: Primary
        team: t_omni
        timezone: America/Mexico_City
        rotation: weekly
        handoff: "09:00"
        start: "2026-10-26"
        users: [u_pod32g]
    escalation_policies:
      - id: ep_omni
        name: Omni escalation
        team: t_omni
        repeat: 2
        levels:
          - {delay: 10m, schedules: [sch_primary]}
    services:
      - {id: svc_jellyfin, name: jellyfin, description: "Media server: streaming and transcoding.", escalation_policy: ep_omni}
      - {id: svc_media_host, name: media-host, description: "Media storage host (cold, cold2).", escalation_policy: ep_omni}
      - {id: svc_omni_media, name: omni-media, description: "Episode tracker and downloads.", escalation_policy: ep_omni}
      - {id: svc_identity, name: omni-identity, description: "Sign-in for every Omni service.", escalation_policy: ep_omni}
      - {id: svc_access, name: omni-access, description: "Gateway for *.omni.pod32g.dev.", escalation_policy: ep_omni}
      - {id: svc_notify, name: omni-notify, description: "Notification delivery.", escalation_policy: ep_omni}
      - {id: svc_metrics, name: omni-metrics, description: "Metrics and alert rules.", escalation_policy: ep_omni}
      - {id: svc_logging, name: omni-logging, description: "Log collection and search.", escalation_policy: ep_omni}
      # fansly-api's alerts (storage, logins, recorder drain and build) reach it
      # through provider oncall-fansly, routed on labels.service=fansly.
      - {id: svc_fansly, name: fansly, description: "Stream recorder: storage, logins and the recorder.", escalation_policy: ep_omni}
