services:
  omni-notify:
    build:
      context: .
      args:
        VERSION: ${VERSION:-0.1.0}
    image: omni-notify:local
    container_name: omni-notify
    restart: unless-stopped
    # The config file sets the listen address (:8080) and SQLite path (/data).
    command: ["-config", "/etc/omni-notify/config.yml"]
    environment:
      # Bearer token(s) accepted by the API. Secret → host .env / CI secret,
      # referenced as ${OMNI_NOTIFY_API_TOKEN} by config.docker.yml.
      OMNI_NOTIFY_API_TOKEN: ${OMNI_NOTIFY_API_TOKEN:-}
      # Base64 32-byte key used to encrypt provider secrets at rest. Required
      # whenever any provider has a secret. Secret → host env / CI secret.
      OMNI_NOTIFY_ENCRYPTION_KEY: ${OMNI_NOTIFY_ENCRYPTION_KEY:-}
      # Ingest key for forwarding logs to omni-logging (config.docker.yml's
      # log.forward.api_key). Must match an OMNILOG_INGEST_KEYS value on the
      # omni-logging side. Secret → host .env / CI secret.
      OMNI_LOGGING_API_KEY: ${OMNI_LOGGING_API_KEY:-}
      # Route plain-HTTP egress (logship to omnilog) through the netviz-sidecar's
      # forward proxy so Omni-NetViz sees the outbound edge. HTTP only (no
      # HTTPS_PROXY), so HTTPS notification providers (Discord/Slack/…) stay direct
      # and are unaffected by the app's SSRF guard; localhost excluded.
      HTTP_PROXY: "${HTTP_PROXY:-http://netviz-sidecar:13128}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,omni-notify}"
    # HTTP is fronted by the netviz-sidecar (below): expose internally instead of
    # publishing. The sidecar takes over host port 8088.
    expose:
      - "8080"
    # chizu's own resolver is public, so containers can't resolve the homelab
    # names. The on-call plugin checks sign-ins against Omni Identity
    # (identity.omni.pod32g.dev): ask the Pi-hole first, as Omni Access does.
    dns:
      - ${OMNI_NOTIFY_DNS:-192.168.68.35}
      - 1.1.1.1
    volumes:
      - omni-notify-data:/data
      - ./config.docker.yml:/etc/omni-notify/config.yml:ro
    healthcheck:
      # Distroless has no shell/curl, so the binary self-probes.
      test: ["CMD", "/omni-notify", "healthcheck", "-url", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- Omni-NetViz observability sidecar ---
  # Fronts omni-notify's published port (8088) and reverse-proxies to the app on
  # the internal network, reporting inbound traffic metadata to Omni-NetViz.
  # Metadata only — never bodies or credentials; talks only to Omni-NetViz.
  # Requires the netviz-sidecar:local image on the deploy host (built from
  # github.com/pod32g/omni-netviz Dockerfile.sidecar).
  netviz-sidecar:
    image: netviz-sidecar:local
    container_name: omni-notify-netviz
    restart: unless-stopped
    depends_on:
      - omni-notify
    command:
      - "-service=omni-notify"
      - "-host=chizu"
      - "-namespace=omni-notify"
      - "-environment=prod"
      - "-docker-network=omni-notify_default"
      - "-listen=:8088"
      - "-upstream=http://omni-notify:8080"
      - "-proxy-listen=:13128"
      - "-flush-interval=10s"
    environment:
      NETVIZ_URL: "${NETVIZ_URL:-http://192.168.68.34:8099}"
      NETVIZ_TOKEN: "${NETVIZ_INGEST_TOKEN:-}"
    ports:
      - "8088:8088"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  omni-notify-data:
    name: omni-notify-data
